name: sync-forks
on:
  schedule: [{ cron: "0 4 * * 1" }]
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - env: { GH_TOKEN: "${{ secrets.SYNC_TOKEN }}" }
        run: |
          for org in jcg9129-cp jcg9129-dev jcg9129-learning jcg9129-tools; do
            for r in $(gh repo list "$org" --fork --limit 300 --json name --jq '.[].name'); do
              gh repo sync "$org/$r" || echo "::warning::$org/$r not synced"
            done
          done
